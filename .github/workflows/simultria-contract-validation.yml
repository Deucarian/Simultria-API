name: Validate Simultria API package

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Validate generated contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install OpenAPI YAML support
        shell: bash
        run: python -m pip install PyYAML==6.0.3

      - name: Run contract generator tests
        shell: bash
        run: python -m unittest discover "Tools~/tests"

      - name: Validate checked-in generated artifacts
        shell: bash
        run: python "Tools~/update_contract.py" --validate-generated

      - name: Describe authoritative source gate
        shell: bash
        run: |
          test -f "Documentation~/CONTRACT_AUTOMATION.md"
          grep -q "Simultria API Contract Compatibility" "Documentation~/CONTRACT_AUTOMATION.md"

      - name: Check whitespace
        shell: bash
        run: git diff --check

  package-governance:
    name: Validate package governance
    uses: Deucarian/Package-Registry/.github/workflows/deucarian-package-validation.yml@develop
